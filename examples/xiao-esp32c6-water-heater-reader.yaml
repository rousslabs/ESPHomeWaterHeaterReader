# Seeed Studio XIAO ESP32-C6 reading a Honeywell/Resideo WV8840_ water heater
# controller, with inlet and outlet NTC thermistors. Onboard antenna.
#
# Paste this over the YAML that ESPHome Device Builder generates for a new
# device. Secrets come from /config/esphome/secrets.yaml:
#   wifi_ssid, wifi_password, api_key, ota_password
#
# Wiring (XIAO pin / GPIO):
#   valve RX   <- D6  / GPIO16
#   valve TX   -> D7  / GPIO17
#   valve GND  -- GND
#   NTC inlet  divider on D1 / GPIO1, powered from D3 / GPIO21
#   NTC outlet divider on D0 / GPIO0, powered from D3 / GPIO21
#   D10 / GPIO18 is used as a dummy UART pin; leave it unconnected.

substitutions:
  name: water-heater-reader
  friendly_name: Water Heater Reader

esphome:
  name: $name
  friendly_name: $friendly_name

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Water Heater Reader Fallback"

captive_portal:

packages:
  reader:
    url: https://github.com/rousslabs/ESPHomeWaterHeaterReader
    ref: main
    refresh: 1d
    files:
      - packages/modbus-esp32c6.yaml              # UART, IrDA and Modbus for the C6
      - packages/wv8840_-modbus.yaml              # valve registers, sensors, controls
      - packages/ntc-inlet-outlet.yaml            # remove if no thermistors
      - packages/board-xiao-esp32c6.yaml          # board, pins, LED (keep last)
      # - packages/xiao-esp32c6-external-antenna.yaml   # only with a u.FL antenna fitted

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
