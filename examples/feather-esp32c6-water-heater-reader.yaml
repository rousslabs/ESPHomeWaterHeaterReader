# Adafruit ESP32-C6 Feather reading a Honeywell/Resideo WV8840_ water heater
# controller, with inlet and outlet NTC thermistors.
#
# Paste this over the YAML that ESPHome Device Builder generates for a new
# device. Secrets come from /config/esphome/secrets.yaml:
#   wifi_ssid, wifi_password, api_key, ota_password
#
# Wiring (Feather pin / GPIO):
#   valve RX   <- TX  / GPIO16
#   valve TX   -> RX  / GPIO17
#   valve GND  -- GND
#   NTC inlet  divider on A0 / GPIO1, powered from D9 / GPIO7
#   NTC outlet divider on A5 / GPIO2, powered from D9 / GPIO7
#   D12 / GPIO14 is used as a dummy UART pin; leave it unconnected.

substitutions:
  name: water-heater-reader
  friendly_name: Water Heater Reader
  # Feather pins. Repeated here from the board package because values in the
  # device YAML always win over package defaults.
  uart_tx: GPIO16
  uart_rx: GPIO17
  uart_dummy_tx: GPIO14
  ntc_inlet_pin: GPIO1
  ntc_outlet_pin: GPIO2
  ntc_power_pin: GPIO7

esphome:
  name: $name
  friendly_name: $friendly_name

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Water Heater Reader Fallback"

captive_portal:

packages:
  reader:
    url: https://github.com/rousslabs/ESPHomeWaterHeaterReader_ESP32C6
    ref: main
    refresh: 1d
    files:
      - packages/modbus-esp32c6.yaml                   # UART, IrDA and Modbus for the C6
      - packages/wv8840_-modbus.yaml                   # valve registers, sensors, controls
      - packages/ntc-inlet-outlet.yaml                 # remove if no thermistors
      - packages/board-adafruit-feather-esp32c6.yaml   # board, pins, LED (keep last)

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
